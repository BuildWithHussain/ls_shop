{% set analytics_settings = frappe.get_cached_doc("Analytics Settings") %}
{% if analytics_settings.get("enable_first_party") %}
<script>
	window.ls_currency = "{{ frappe.get_cached_doc('Global Defaults').default_currency or 'USD' }}";
	(() => {
		const capture_url = '/api/method/ls_shop.api.analytics.capture';
		const csrf_token = '{{ frappe.session.csrf_token }}';
		const session_idle_ms = 30 * 60 * 1000;
		const utm_ttl_ms = 30 * 24 * 60 * 60 * 1000;
		const utm_keys = ['source', 'medium', 'campaign', 'term', 'content'];

		function set_cookie(name, value, max_age_seconds) {
			document.cookie = `${name}=${encodeURIComponent(value)}; path=/; max-age=${max_age_seconds}; SameSite=Lax`;
		}

		function get_session_id() {
			const now = Date.now();
			let session = null;
			try {
				session = JSON.parse(localStorage.getItem('ls_sid'));
			} catch (error) {
				session = null;
			}
			if (!session || !session.id || now - session.ts > session_idle_ms) {
				const id = window.crypto?.randomUUID
					? crypto.randomUUID()
					: `${now.toString(36)}-${Math.random().toString(36).slice(2)}`;
				session = { id, ts: now };
			}
			session.ts = now;
			localStorage.setItem('ls_sid', JSON.stringify(session));
			set_cookie('ls_sid', session.id, 1800);
			return session.id;
		}

		function save_utm_params() {
			const query_params = new URLSearchParams(location.search);
			const utm = {};
			for (const key of utm_keys) {
				const value = query_params.get(`utm_${key}`);
				if (value) utm[key] = value;
			}
			if (!Object.keys(utm).length) return;
// ts caps the localStorage copy at the same 30-day window as the cookie
			localStorage.setItem('ls_utm', JSON.stringify({ ...utm, ts: Date.now() }));
			set_cookie('ls_utm', JSON.stringify(utm), 30 * 24 * 60 * 60);
		}

		function get_utm_fields() {
			let utm = null;
			try {
				utm = JSON.parse(localStorage.getItem('ls_utm'));
			} catch (error) {
				utm = null;
			}
			if (!utm) return {};
			if (utm.ts && Date.now() - utm.ts > utm_ttl_ms) {
				localStorage.removeItem('ls_utm');
				return {};
			}
			const fields = {};
			for (const key of utm_keys) {
				if (utm[key]) fields[`utm_${key}`] = utm[key];
			}
			return fields;
		}

		async function track(event, payload = {}) {
			try {
				const body = {
					event,
					session_id: get_session_id(),
					path: location.pathname,
					referrer: document.referrer,
					...get_utm_fields(),
					...payload,
				};
				const headers = { 'Content-Type': 'application/json; charset=utf-8' };
// Guest sessions render the token as the literal string "None".
				if (csrf_token && csrf_token !== 'None') headers['X-Frappe-CSRF-Token'] = csrf_token;
				await fetch(capture_url, {
					method: 'POST',
					headers,
					body: JSON.stringify(body),
					keepalive: true,
				});
			} catch (error) {
// Capture failures must never surface to shoppers.
			}
		}

		window.lsAnalytics = { track };
		try {
			save_utm_params();
		} catch (error) {
// localStorage can be unavailable (private mode); page keeps working.
		}
		track('page_view');
	})();
</script>
{% endif %}
